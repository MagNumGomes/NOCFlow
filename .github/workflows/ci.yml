name: Qualidade

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows - testes e build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      NOC_TEST_BROWSER: '1'
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar snapshot Windows
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python.exe -m pip --isolated install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r scripts/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-build\Scripts\python.exe -m pip check
      - name: Conferir versao e fontes geradas
        run: |
          .\.venv-build\Scripts\python.exe scripts/versionar.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\.venv-build\Scripts\python.exe scripts/versionar.py --check --tag $env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'A tag precisa apontar para um commit integrado na main.' }
          }
      - name: Ruff
        run: .\.venv-build\Scripts\python.exe -m ruff check . --no-cache
      - name: Verificar segredos nas fontes
        run: .\.venv-build\Scripts\python.exe scripts/verificar_segredos.py
      - name: Instalar Chromium
        run: .\.venv-build\Scripts\python.exe -m playwright install chromium --no-shell
      - name: Preparar OCR ingles do Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $nome = 'Language.OCR~~~en-US~0.0.1.0'
          $capacidade = Get-WindowsCapability -Online -Name $nome
          if (-not $capacidade) { throw 'OCR ingles indisponivel neste runner.' }
          if ($capacidade.State -ne 'Installed') {
            $resultado = Add-WindowsCapability -Online -Name $nome
            if ($resultado.RestartNeeded) { throw 'Instalacao de OCR exige reinicio do runner.' }
          }
      - name: Testes completos
        run: .\.venv-build\Scripts\python.exe -m unittest discover -s tests -v
      - name: Smoke por fonte
        run: .\.venv-build\Scripts\python.exe scripts/verificar_build.py
      - name: Provisionar certificado da release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGN_PFX: ${{ secrets.NOCFLOW_SIGN_PFX_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.NOCFLOW_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX) { throw 'Configure o certificado de code signing para publicar releases.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'nocflow-sign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX))
            $senha = ConvertTo-SecureString $env:SIGN_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $senha
            "NOCFLOW_SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Build e smoke empacotado
        run: .\build.ps1 -SomentePacote
      - name: Remover certificado temporario
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          if ($env:NOCFLOW_SIGN_CERT_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:NOCFLOW_SIGN_CERT_THUMBPRINT" -DeleteKey -Force
          }
      - name: Preparar ZIP e checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\.venv-build\Scripts\python.exe scripts/empacotar_release.py
      - name: Artefatos da release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Relatorios de smoke
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verificacao-windows
          path: build/verificacao*.json
          if-no-files-found: ignore
          retention-days: 14

  dependencias:
    name: Dependencias - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar auditor
        run: python -m pip install -r scripts/requirements-audit.txt
      - name: Consultar vulnerabilidades do snapshot completo
        run: python -m pip_audit --requirement scripts/requirements-windows.txt --no-deps --disable-pip --format json --output auditoria-dependencias.json
      - name: Relatorio de dependencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditoria-dependencias
          path: auditoria-dependencias.json
          if-no-files-found: ignore
          retention-days: 14
