name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read
  publicar:
    name: Publicar release validada
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows
          path: release
      - name: Verificar checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publicar ZIP, checksum e notas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.zip release/SHA256SUMS.txt --verify-tag --title "NOCFlow $TAG" --notes-file release/NOTAS.md
