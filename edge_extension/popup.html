<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>NOCFlow</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Assinatura WhatsApp</h1>
  <label for="nome">Seu nome</label>
  <input id="nome" maxlength="120" autocomplete="name" placeholder="Nome do operador">
  <button id="salvar">Salvar nome</button>
  <p>Escreva sua mensagem no WhatsApp Web e clique abaixo para inserir “Nome - Equipe NOC” no início.</p>
  <button id="assinar">Assinar mensagem em edição</button>
  <p>A mensagem permanece em edição para você revisar e enviar.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
